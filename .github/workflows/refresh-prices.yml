name: Refresh model prices

# Model prices change a few times a year, so a weekly check is plenty. The job
# never pushes to main: it opens a pull request, so a price change always arrives
# as a reviewable diff. If the two upstream feeds disagree the script exits
# non-zero and this job fails, which is the intended signal to look manually.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm run prices

      - name: Open a pull request if the table changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/prices.json; then
            echo "Prices unchanged — nothing to do."
            exit 0
          fi

          branch=chore/refresh-model-prices
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add src/prices.json
          git commit -m 'Refresh model price table'
          git push --force-with-lease origin "$branch"

          gh pr view "$branch" --json state --jq .state | grep -q OPEN \
            || gh pr create --base main --head "$branch" \
                 --title 'Refresh model price table' \
                 --body 'Automated refresh of `src/prices.json`. Both upstream feeds agreed on every value. Review the diff before merging.'
